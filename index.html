<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relaciones</title>

<style>

    *{
        box-sizing:border-box;
        margin:0;
        padding:0;
        font-family:Verdana, sans-serif;
    }

    body{
        background:#d2a56d;
        padding:40px;
        color:#4b2e1d;
    }

    .panel{
        max-width:900px;
        margin:auto;
        background:#f0d39c;
        border:6px solid #9b6b3d;
        border-radius:14px;
        overflow:hidden;
        box-shadow:0 10px 25px rgba(0,0,0,0.25);
    }

    .title{
        background:#c78d4e;
        padding:20px;
        font-size:28px;
        font-weight:bold;
        border-bottom:4px solid #9b6b3d;
    }

    .character{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:18px;
        border-bottom:2px solid rgba(0,0,0,0.08);
    }

    .left{
        display:flex;
        align-items:center;
        gap:16px;
    }

    .avatar{
        width:64px;
        height:64px;
        border-radius:8px;
        object-fit:cover;
        border:3px solid #8d5b31;
        background:white;
    }

    .info h2{
        font-size:24px;
        margin-bottom:4px;
    }

    .info p{
        opacity:0.7;
        font-size:14px;
    }

    .hearts{
        display:flex;
        gap:4px;
        font-size:28px;
    }

    .heart.empty{
        opacity:0.2;
    }

</style>
</head>
<body>

<div class="panel">

    <div class="title">
        Relaciones
    </div>

    <div id="characters"></div>

</div>

<script>

//////////////////////////////////////////////////////////
// AQUI EDITAS TUS PERSONAJES
//////////////////////////////////////////////////////////

const characters = [

    {
        name: "Jur Klopp",
        subtitle: "Mejor amigo",
        hearts: 8,
        maxHearts: 10,
        image: "https://i.imgur.com/JYUB0m3.png"
    },

    {
        name: "Vivi Ornitier",
        subtitle: "Confianza extraña",
        hearts: 5,
        maxHearts: 10,
        image: "https://i.imgur.com/fY6XGJx.png"
    },

    {
        name: "Ramsay",
        subtitle: "Relación tensa",
        hearts: 2,
        maxHearts: 10,
        image: "https://i.imgur.com/8QfR8hG.png"
    }

];

//////////////////////////////////////////////////////////
// NO TOCAR SI NO QUIERES MODIFICAR EL FUNCIONAMIENTO
//////////////////////////////////////////////////////////

const container = document.getElementById("characters");

characters.forEach(character => {

    const row = document.createElement("div");
    row.className = "character";

    let heartsHTML = "";

    for(let i = 0; i < character.maxHearts; i++){

        if(i < character.hearts){
            heartsHTML += `<span>❤️</span>`;
        }else{
            heartsHTML += `<span class="heart empty">❤️</span>`;
        }
    }

    row.innerHTML = `
        <div class="left">

            <img class="avatar" src="${character.image}">

            <div class="info">
                <h2>${character.name}</h2>
                <p>${character.subtitle}</p>
            </div>

        </div>

        <div class="hearts">
            ${heartsHTML}
        </div>
    `;

    container.appendChild(row);

});

</script>

</body>
</html>
