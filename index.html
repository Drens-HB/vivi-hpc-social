<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&display=swap" rel="stylesheet">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    font-size:75%;
}

body{
    min-height:100vh;
    font-family:'Cinzel', serif;
    background:
        radial-gradient(circle at top,
        #2a0a4d 0%,
        #140021 45%,
        #050008 100%);
    background-attachment:fixed;
    color:#e7d1a2;
    padding:40px;
}

.container{
    width:100%;
    max-width:780px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:45px;
}
header h1{
    font-size:4.6rem;
    font-weight:700;
    letter-spacing:3px;
    color:#f2d7a0;
}

header p{
    margin-top:-4px;
    font-size:1.2rem;
    opacity:0.7;
    font-style:italic;
}

.characters{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.character-card{

    position:relative;

    display:flex;
    align-items:center;

    min-height:90px;

    padding:16px 20px;

    border:1px solid rgba(220,170,90,0.35);

    border-radius:14px;

    background:
        linear-gradient(
            90deg,
            rgba(33,7,58,0.88),
            rgba(8,0,22,0.96)
        );

    overflow:visible;

    transition:0.2s;
}

.character-card:hover{
    border-color:rgba(255,215,130,0.55);

    box-shadow:
        0 0 18px rgba(163,84,255,0.12);
}

.left{
    display:flex;
    align-items:center;
    gap:18px;
}

.avatar{

    width:72px;
    height:72px;

    border-radius:12px;

    object-fit:cover;

    border:1px solid rgba(230,190,120,0.35);

    background:
        linear-gradient(145deg,#2a1247,#140021);

    box-shadow:
        0 0 18px rgba(120,60,255,0.08);

    flex-shrink:0;
}

.info{
    min-width:170px;
}

.character-name{

    font-size:1.8rem;

    font-weight:700;

    color:#f0d8aa;
}

.character-sub{

    margin-top:3px;

    font-size:1.15rem;

    opacity:0.8;

    font-style:italic;
}

.divider{

    width:1px;
    height:48px;

    background:
        linear-gradient(
            transparent,
            rgba(255,215,120,0.25),
            transparent
        );

    margin:0 26px;
}

.right{

    display:flex;
    align-items:center;

    gap:12px;

    margin-left:auto;
}

.hearts{

    display:flex;

    gap:2px;

    min-width:auto;

    justify-content:center;
}

.heart{

    font-size:1.3rem;

    color:#3b2446;
}

.heart.filled{

    color:#ffd86f;

    opacity:1;

    text-shadow:
        0 0 10px rgba(255,216,111,0.45);
}

.heart.enemy{

    color:#d84b5f;

    opacity:1;

    text-shadow:
        0 0 10px rgba(216,75,95,0.35);
}

.visualize-wrapper{
    position:relative;
}

.visualize{

    cursor:pointer;

    font-size:0.75rem;

    letter-spacing:1px;

    color:#d9bb80;

    transition:0.2s;

    white-space:nowrap;
}

.visualize:hover{
    color:#ffe4aa;
}

.pagination{

    display:flex;

    justify-content:center;

    gap:14px;

    margin-top:30px;
}

.pagination button{

    padding:10px 18px;

    background:
        linear-gradient(
            180deg,
            rgba(35,10,60,0.95),
            rgba(12,0,25,0.95)
        );

    border:1px solid rgba(255,215,120,0.25);

    color:#e7d1a2;

    font-family:'Cinzel', serif;

    cursor:pointer;

    border-radius:10px;

    transition:0.2s;
}

.pagination button:hover{

    border-color:rgba(255,215,120,0.5);

    box-shadow:
        0 0 14px rgba(163,84,255,0.12);
}

.popup{

    position:absolute;

    top:120%;
    right:0;

    width:260px;

    padding:18px;

    border-radius:14px;

    border:1px solid rgba(255,215,130,0.25);

    background:
        linear-gradient(
            180deg,
            rgba(21,4,36,0.97),
            rgba(7,0,18,0.98)
        );

    backdrop-filter:blur(8px);

    opacity:0;
    visibility:hidden;

    transform:translateY(8px);

    transition:0.25s;

    z-index:9999;

    box-shadow:
        0 0 24px rgba(0,0,0,0.55);
}

.visualize-wrapper:hover .popup{

    opacity:1;
    visibility:visible;

    transform:translateY(0);
}

.popup img{

    width:100%;
    height:180px;

    object-fit:cover;

    border-radius:10px;

    margin-bottom:12px;

    background:#120021;
}

.popup h3{

    font-size:1.5rem;
    margin-bottom:6px;
}

.popup p{

    font-size:0.95rem;
    line-height:1.5;

    opacity:0.85;
}

</style>
</head>

<body>

    <p>"¿Cómo demuestras que existes...? Quizás no existimos..."</p>

<div class="pagination">

    <button onclick="prevPage()">

const container = document.getElementById("characters");

function renderCharacters(){

    container.innerHTML = "";

    const sortedCharacters = [...characters]

    .sort((a,b)=>b.hearts-a.hearts);

    const start = (currentPage - 1) * perPage;
    const end = start + perPage;

    const visibleCharacters = sortedCharacters.slice(start,end);

    visibleCharacters.forEach(character => {

        const card = document.createElement("div");
        card.className = "character-card";

        let heartsHTML = "";

const heartClass = character.hearts <= 3
    ? 'enemy'
    : 'filled';

for(let i = 0; i < character.maxHearts; i++){

    heartsHTML += `
        <span class="heart ${i < character.hearts ? heartClass : ''}">
            ✦
        </span>
    `;
}

        card.innerHTML = `

            <div class="left">

                <img
                    class="avatar"
                    src="${character.image}"
                >

                <div class="info">

                    <div class="character-name">
                        ${character.name}
                    </div>

                    <div class="character-sub">
                        ${character.subtitle}
                    </div>

                </div>

            </div>

            <div class="right">

                <div class="divider"></div>

                <div class="hearts">
                    ${heartsHTML}
                </div>

                <div class="visualize-wrapper">

                    <div class="visualize">
                        [ Visualizar ]
                    </div>

                    <div class="popup">

                        <img
                            src="${character.preview}"
                            onerror="this.style.display='none'"
                        >

                        <h3>${character.name}</h3>

                        <p>
                            ${character.description}
                        </p>

                    </div>

                </div>

            </div>
        `;

        container.appendChild(card);

    });

}

function nextPage(){

    const totalPages = Math.ceil(characters.length / perPage);

    if(currentPage < totalPages){

        currentPage++;

        renderCharacters();
    }
}

function prevPage(){

    if(currentPage > 1){

        currentPage--;

        renderCharacters();
    }
}

renderCharacters();
</script>
